<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"><rect width="1000" height="250" fill="#f4f7fa"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><text x="500" y="35" fill="#1b365d" font-size="24">从组织设计到人员发展</text><g fill="#e3f2f1" stroke="#006d77" stroke-width="2"><rect x="20" y="70" width="210" height="90" rx="10"/><rect x="270" y="70" width="210" height="90" rx="10"/><rect x="520" y="70" width="210" height="90" rx="10"/><rect x="770" y="70" width="210" height="90" rx="10"/></g><g fill="#1b365d" font-size="21"><text x="125" y="107">确定岗位需求</text><text x="125" y="140">任务与原则</text><text x="375" y="107">选聘与录用</text><text x="375" y="140">内部 / 外部</text><text x="625" y="107">人事考评</text><text x="625" y="140">标准 → 反馈</text><text x="875" y="107">培训与发展</text><text x="875" y="140">能力持续提升</text></g><g stroke="#006d77" stroke-width="4"><path d="M230 115h35 M480 115h35 M730 115h35"/></g><text x="500" y="215" fill="#1b365d" font-size="18">岗位与人员变化时，重新调整配置；组织文化影响成员协作</text></g></svg>