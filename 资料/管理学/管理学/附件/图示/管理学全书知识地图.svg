<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="618" viewBox="0 0 1100 618">
<rect width="1100" height="618" rx="18" fill="#f4f7fa"/>
<text x="550" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1b365d">管理学：从目标到行动，再到调整</text>
<rect x="48" y="75" width="1004" height="58" rx="10" fill="#e5f3f3" stroke="#006d77"/>
<text x="550" y="112" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#1b365d">管理导论与理论演变：认识组织、管理与不同视角</text>
<rect x="48" y="153" width="1004" height="58" rx="10" fill="#e7edf5" stroke="#006d77"/>
<text x="550" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#1b365d">决策与环境 → 决策实施：找问题、选方案、落实与追踪</text>
<rect x="48" y="231" width="1004" height="58" rx="10" fill="#e5f3f3" stroke="#006d77"/>
<text x="550" y="268" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#1b365d">组织设计 → 人员配备 → 组织文化：安排任务、人员与协作</text>
<rect x="48" y="309" width="1004" height="58" rx="10" fill="#e7edf5" stroke="#006d77"/>
<text x="550" y="346" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#1b365d">领导 → 激励 → 沟通：影响成员、协调行动</text>
<rect x="48" y="387" width="1004" height="58" rx="10" fill="#e5f3f3" stroke="#006d77"/>
<text x="550" y="424" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#1b365d">控制过程与方法 → 风险和危机：比较目标、纠偏并准备应对</text>
<rect x="48" y="465" width="1004" height="58" rx="10" fill="#e7edf5" stroke="#006d77"/>
<text x="550" y="502" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#1b365d">创新原理 → 组织创新 → 互联网展望：学习、变革并适应环境</text>
</svg>