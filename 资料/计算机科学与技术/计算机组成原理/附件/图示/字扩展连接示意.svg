<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="white"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#1b365d" font-size="27">
<text x="40" y="42" font-weight="bold">字扩展：高位地址选择不同芯片</text>
<rect x="330" y="190" width="220" height="100" rx="8" fill="#f0f7f7" stroke="#1b365d" stroke-width="3"/>
<rect x="650" y="190" width="220" height="100" rx="8" fill="#f0f7f7" stroke="#1b365d" stroke-width="3"/>
<text x="440" y="238" text-anchor="middle">芯片 1</text><text x="440" y="270" text-anchor="middle">1K × 8 位</text>
<text x="760" y="238" text-anchor="middle">芯片 2</text><text x="760" y="270" text-anchor="middle">1K × 8 位</text>
<path d="M160 97 H1000 M440 97 V190 M760 97 V190" stroke="#006d77" stroke-width="4" fill="none"/>
<text x="600" y="82" text-anchor="middle">低位地址 A0—A9 同时连接两片</text>
<path d="M440 290 V350 H760 V290" stroke="#006d77" stroke-width="4" fill="none"/>
<text x="600" y="389" text-anchor="middle">共用数据 D7—D0；每次选择一片</text>
<path d="M120 425 H1080" stroke="#1b365d" stroke-width="3"/>
<text x="600" y="466" text-anchor="middle">A10 = 0 选芯片 1；A10 = 1 选芯片 2</text>
<text x="600" y="510" text-anchor="middle">写使能共用；合计 2K × 8 位</text>
</g></svg>
