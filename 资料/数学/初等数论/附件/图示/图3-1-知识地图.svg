<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="145" viewBox="0 0 1000 145"><title>筛法与试除知识地图</title><g font-family="Microsoft YaHei, sans-serif"><rect x="40" y="32" width="240" height="82" rx="8" fill="#f0f7f7" stroke="#006d77" stroke-width="2"/><text text-anchor="middle" x="160" y="66" font-size="23" font-weight="bold" fill="#1b365d">给定整数范围</text><text text-anchor="middle" x="160" y="96" font-size="19" fill="#1b365d">明确上限与起点</text><rect x="380" y="32" width="240" height="82" rx="8" fill="#f0f7f7" stroke="#006d77" stroke-width="2"/><text text-anchor="middle" x="500" y="66" font-size="23" font-weight="bold" fill="#1b365d">筛法或试除</text><text text-anchor="middle" x="500" y="96" font-size="19" fill="#1b365d">只需考虑平方根内</text><rect x="720" y="32" width="240" height="82" rx="8" fill="#f0f7f7" stroke="#006d77" stroke-width="2"/><text text-anchor="middle" x="840" y="66" font-size="23" font-weight="bold" fill="#1b365d">判断素数</text><text text-anchor="middle" x="840" y="96" font-size="19" fill="#1b365d">保留条件与边界</text><path d="M280 73 H369 M620 73 H709" stroke="#006d77" stroke-width="3"/><path d="M370 73 l-11 -6 v12 z M710 73 l-11 -6 v12 z" fill="#006d77"/></g></svg>