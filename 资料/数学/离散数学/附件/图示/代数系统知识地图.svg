<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285"><rect width="1100" height="285" fill="white"/><g font-family="SimSun, serif" fill="#1B365D"><rect x="20" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="72.5" y="75" font-size="25">集合与运算</text><text x="68.5" y="105" font-size="19" fill="#333">封闭和运算性质</text><path d="M250 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="300" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="340" y="75" font-size="25">半群与幺半群</text><text x="348.5" y="105" font-size="19" fill="#333">结合律与单位元</text><path d="M530 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="580" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="645" y="75" font-size="25">群与子群</text><text x="638" y="105" font-size="19" fill="#333">单位元和逆元</text><path d="M810 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="860" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="887.5" y="75" font-size="25">群的进一步性质</text><text x="889.5" y="105" font-size="19" fill="#333">阶、循环与拉格朗日</text><rect x="50" y="180" width="1000" height="75" rx="8" fill="#F0F7F7" stroke="#006D77" stroke-width="3"/><text x="350.5" y="211" font-size="21" fill="#006D77">易混：有单位元不代表每个元素都有逆元。</text><text x="360" y="239" font-size="20" fill="#333">前接集合与函数；运算规定对象怎样组合。</text></g></svg>