<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285"><rect width="1100" height="285" fill="white"/><g font-family="SimSun, serif" fill="#1B365D"><rect x="20" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="72.5" y="75" font-size="25">函数的定义</text><text x="59" y="105" font-size="19" fill="#333">输入对应唯一输出</text><path d="M250 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="300" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="352.5" y="75" font-size="25">单射与满射</text><text x="339" y="105" font-size="19" fill="#333">不撞车与覆盖陪域</text><path d="M530 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="580" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="645" y="75" font-size="25">复合与逆</text><text x="628.5" y="105" font-size="19" fill="#333">顺序与可逆条件</text><path d="M810 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="860" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="925" y="75" font-size="25">鸽洞原理</text><text x="918" y="105" font-size="19" fill="#333">对象多于抽屉</text><rect x="50" y="180" width="1000" height="75" rx="8" fill="#F0F7F7" stroke="#006D77" stroke-width="3"/><text x="340" y="211" font-size="21" fill="#006D77">易混：值域不一定等于陪域；可逆需要双射。</text><text x="380" y="239" font-size="20" fill="#333">前接关系；鸽洞原理用计数分析映射。</text></g></svg>