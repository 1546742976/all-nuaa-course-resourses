<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285"><rect width="1100" height="285" fill="white"/><g font-family="SimSun, serif" fill="#1B365D"><rect x="20" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="60" y="75" font-size="25">有序对与关系</text><text x="78" y="105" font-size="19" fill="#333">积集中的子集</text><path d="M250 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="300" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="352.5" y="75" font-size="25">性质与矩阵</text><text x="329.5" y="105" font-size="19" fill="#333">自环、反向边、传递</text><path d="M530 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="580" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="632.5" y="75" font-size="25">运算与闭包</text><text x="628.5" y="105" font-size="19" fill="#333">合成、逆与补足</text><path d="M810 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="860" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="912.5" y="75" font-size="25">等价与偏序</text><text x="927.5" y="105" font-size="19" fill="#333">分组或比较</text><rect x="50" y="180" width="1000" height="75" rx="8" fill="#F0F7F7" stroke="#006D77" stroke-width="3"/><text x="382" y="211" font-size="21" fill="#006D77">易混：对称与反对称并非互相否定。</text><text x="370" y="239" font-size="20" fill="#333">前接集合；函数是满足特定条件的关系。</text></g></svg>