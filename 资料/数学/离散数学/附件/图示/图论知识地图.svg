<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285"><rect width="1100" height="285" fill="white"/><g font-family="SimSun, serif" fill="#1B365D"><rect x="20" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="85" y="75" font-size="25">顶点与边</text><text x="78" y="105" font-size="19" fill="#333">图及顶点的度</text><path d="M250 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="300" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="352.5" y="75" font-size="25">矩阵与可达</text><text x="339" y="105" font-size="19" fill="#333">记录边并分析路径</text><path d="M530 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="580" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="645" y="75" font-size="25">路径与环</text><text x="609.5" y="105" font-size="19" fill="#333">连通、欧拉与最短路</text><path d="M810 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="860" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="900" y="75" font-size="25">图的特殊结构</text><text x="899" y="105" font-size="19" fill="#333">树、匹配与平面图</text><rect x="50" y="180" width="1000" height="75" rx="8" fill="#F0F7F7" stroke="#006D77" stroke-width="3"/><text x="371.5" y="211" font-size="21" fill="#006D77">易混：欧拉关注边；哈密顿关注顶点。</text><text x="340" y="239" font-size="20" fill="#333">前接集合与关系；每个结构都应核对适用条件。</text></g></svg>