<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285"><rect width="1100" height="285" fill="white"/><g font-family="SimSun, serif" fill="#1B365D"><rect x="20" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="60" y="75" font-size="25">命题与联结词</text><text x="68.5" y="105" font-size="19" fill="#333">真假与复合命题</text><path d="M250 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="300" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="340" y="75" font-size="25">真值表与等价</text><text x="358" y="105" font-size="19" fill="#333">逐种赋值比较</text><path d="M530 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="580" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="632.5" y="75" font-size="25">蕴含与推理</text><text x="619" y="105" font-size="19" fill="#333">前提如何支持结论</text><path d="M810 83h40m-10-8 10 8-10 8" stroke="#006D77" stroke-width="4" fill="none"/><rect x="860" y="38" width="230" height="90" rx="8" fill="#F4F7FA" stroke="#1B365D" stroke-width="3"/><text x="950" y="75" font-size="25">范式</text><text x="908.5" y="105" font-size="19" fill="#333">合取与析取形式</text><rect x="50" y="180" width="1000" height="75" rx="8" fill="#F0F7F7" stroke="#006D77" stroke-width="3"/><text x="340" y="211" font-size="21" fill="#006D77">易混：蕴含与等价不同；范式要区分主范式。</text><text x="370" y="239" font-size="20" fill="#333">先识别命题，再用真值规则分析复合式。</text></g></svg>